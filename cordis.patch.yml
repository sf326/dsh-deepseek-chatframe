# dsh-deepseek-chatframe — DSH bundle patch
#
# 把插件的 Host 半侧挂进当前 profile 的配置树；Web 半侧由
# package.json 的 dsh.client 声明，宿主按 `dsh.client.inject` 自动组装
# bundle（设置页 settings.section），这里不用写。
#
# 安装（不手改 profile patch）：
#   dsh plugin --profile web add dsh-deepseek-chatframe
# 本地开发安装：
#   dsh plugin --profile web add link:D:\工作区\插件\dsh-deepseek-chatframe
- insert:
    - id: dsh-deepseek-chatframe
      name: dsh-deepseek-chatframe
      config: {}